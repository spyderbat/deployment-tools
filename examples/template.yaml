# Synthetic example base manifest: a Nano Agent DaemonSet plus the Cluster
# Monitor Deployment, in the shape `helm template` produces. Replace the image
# and registration code with your own before applying anything.
#
# The DaemonSet has no resources, node affinity or tolerations: the tool sets
# those for each node size, replacing anything already there. CLUSTER_NAME is
# also set by the tool, from --cluster-name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spyderbat-serviceaccount
  namespace: spyderbat
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spyderbat-nanoagent
  namespace: spyderbat
spec:
  selector:
    matchLabels:
      app: nanoagent
  template:
    metadata:
      labels:
        app: nanoagent
    spec:
      serviceAccountName: spyderbat-serviceaccount
      hostPID: true
      hostNetwork: true
      containers:
      - name: nanoagent
        image: registry.example.com/spyderbat/nano-agent:latest
        securityContext:
          privileged: true
        env:
        - name: ORC_URL
          value: https://orc.spyderbat.com/
        - name: AGENT_REGISTRATION_CODE
          value: REPLACE_WITH_YOUR_REGISTRATION_CODE
        - name: CLUSTER_NAME
          value: CHANGE_ME
        volumeMounts:
        - name: hostetc
          mountPath: /etc
          readOnly: true
      volumes:
      - name: hostetc
        hostPath:
          path: /etc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clustermonitor-deployment
  namespace: spyderbat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clustermonitor
  template:
    metadata:
      labels:
        app: clustermonitor
    spec:
      serviceAccountName: spyderbat-serviceaccount
      containers:
      - name: clustermonitor
        image: registry.example.com/spyderbat/nano-agent:latest
        env:
        - name: ORC_URL
          value: https://orc.spyderbat.com/
        - name: AGENT_REGISTRATION_CODE
          value: REPLACE_WITH_YOUR_REGISTRATION_CODE
        - name: CLUSTER_NAME
          value: CHANGE_ME
        - name: K8SMONITOR
          value: "true"
        # Suitable for ordinary-sized clusters; very large clusters need more.
        # The tool passes this Deployment through without changing its
        # resources, so these are the values that get deployed.
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 400m
            memory: 512Mi
