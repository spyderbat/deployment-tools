apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoagent-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoagent-cr
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spyderbat-nanoagent
spec:
  selector:
    matchLabels:
      app: nanoagent
  template:
    metadata:
      labels:
        app: nanoagent
    spec:
      serviceAccountName: nanoagent-sa
      containers:
      - name: nanoagent
        image: spyderbat/nano:v1
