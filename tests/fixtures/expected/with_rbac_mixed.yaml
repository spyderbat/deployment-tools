---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoagent-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoagent-cr
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spyderbat-nanoagent-4core
spec:
  selector:
    matchLabels:
      app: nanoagent
  template:
    metadata:
      labels:
        app: nanoagent
    spec:
      serviceAccountName: nanoagent-sa
      containers:
      - name: nanoagent
        image: spyderbat/nano:v1
        resources:
          requests:
            cpu: 200m
            memory: 1064Mi
          limits:
            cpu: 2000m
            memory: 2128Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - small-1
                - small-2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spyderbat-nanoagent-8core
spec:
  selector:
    matchLabels:
      app: nanoagent
  template:
    metadata:
      labels:
        app: nanoagent
    spec:
      serviceAccountName: nanoagent-sa
      containers:
      - name: nanoagent
        image: spyderbat/nano:v1
        resources:
          requests:
            cpu: 400m
            memory: 1104Mi
          limits:
            cpu: 2000m
            memory: 2208Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - med-1
                - med-2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spyderbat-nanoagent-16core
spec:
  selector:
    matchLabels:
      app: nanoagent
  template:
    metadata:
      labels:
        app: nanoagent
    spec:
      serviceAccountName: nanoagent-sa
      containers:
      - name: nanoagent
        image: spyderbat/nano:v1
        resources:
          requests:
            cpu: 800m
            memory: 1184Mi
          limits:
            cpu: 2000m
            memory: 2368Mi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - large-1
